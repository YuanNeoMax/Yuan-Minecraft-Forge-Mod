plugins {
	id 'net.minecraftforge.gradle' version '6.0.24'
	id 'org.jetbrains.kotlin.jvm' version '2.1.21'
	id 'org.jetbrains.kotlin.plugin.compose' version '2.1.21'
	id 'org.jetbrains.compose' version '1.8.2'
}

base {
	archivesName = "${rootProject.name}-${project.name}"
}

// Compose/Skiko 方案 B：直接渲染进 MC 帧缓冲；纯库由 JarJar 打包，FML 按 GAMELIBRARY 加载
jarJar.enable()

// Force Java 17 source/target so we can compile with the system's Java 21.
java {
	sourceCompatibility = JavaVersion.VERSION_17
	targetCompatibility = JavaVersion.VERSION_17
}

tasks.withType(JavaCompile).configureEach {
	options.release = 17
	options.compilerArgs << '-Xlint:-removal'
}

tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
	kotlinOptions.jvmTarget = '17'
}

minecraft {
	mappings channel: 'official', version: minecraft_version
	copyIdeResources = true
	accessTransformer = file('src/main/resources/META-INF/accesstransformer.cfg')

	runs {
		configureEach {
			workingDirectory project.file('run')
			property 'forge.logging.markers', 'REGISTRIES'
			property 'forge.logging.console.level', 'debug'

			mods {
				yuan {
					source sourceSets.main
				}
			}
		}

		client {
			args '--username', rootProject.properties.getOrDefault('minecraft_username', 'Player')
		}
	}
}

jar {
	archiveClassifier.set("")
	from("${rootProject.projectDir}/LICENSE") {
		rename { "${it}_${base.archivesName.get()}"}
	}

	// Compose/Skiko 类直接合并进 jar（含 Skiko 原生 dll 资源）
	from({ project.configurations.composeRuntime.resolvedConfiguration.resolvedArtifacts.collect { zipTree(it.file) } }) {
		exclude 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA'
		exclude 'META-INF/MANIFEST.MF'
		exclude 'module-info.class'
		duplicatesStrategy = DuplicatesStrategy.EXCLUDE
	}

	manifest {
		attributes([
			'Specification-Title'     : 'yuan',
			'Specification-Vendor'    : 'Yuan Author',
			'Specification-Version'   : '1',
			'Implementation-Title'    : project.name,
			'Implementation-Version'  : project.version,
			'Implementation-Vendor'   : 'Yuan Author'
		])
	}
}

tasks.named('jarJar', Jar).configure {
	// The -all jar is what gets shipped, so it must carry the license text too.
	from("${rootProject.projectDir}/LICENSE") {
		rename { "${it}_${base.archivesName.get()}"}
	}
	from({ project.configurations.composeRuntime.resolvedConfiguration.resolvedArtifacts.collect { zipTree(it.file) } }) {
		exclude 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA'
		exclude 'META-INF/MANIFEST.MF'
		exclude 'module-info.class'
		duplicatesStrategy = DuplicatesStrategy.EXCLUDE
	}
}

repositories {
	maven {
		url = 'https://repo.spongepowered.org/maven'
	}
	maven {
		// Photon VFX（斩击雨特效库），1.20.1 Forge 仅发布 snapshot
		url = 'https://maven.firstdark.dev/snapshots'
		content { includeGroup 'com.lowdragmc.photon' }
	}
	maven {
		// Photon 的 pom 把 ldlib 声明为 runtime + 全排除，编译期若需要 LDLib 类型从这里取
		url = 'https://maven.firstdark.dev/snapshots'
		content { includeGroup 'com.lowdragmc.ldlib' }
	}
	google()
}

tasks.named('processResources', ProcessResources).configure {
    def replaceProperties = [
        minecraft_version: '1.20.1',
        minecraft_version_range: '[1.20.1,1.21)',
        forge_version: project.forge_version,
        forge_version_range: '[47,48)',
        loader_version_range: '[47,)',
        mod_id: 'yuan',
        mod_name: 'Yuan',
        mod_version: project.version,
        mod_authors: 'YuanNeo',
        mod_description: 'Yuan weapons and armor mod'
    ]

    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml']) {
        expand replaceProperties
    }
}

configurations {
    composeRuntime
}

// Skiko 桌面端按 AWT 变体解析，否则与 Android 变体产生歧义
configurations.configureEach {
    attributes {
        attribute(Attribute.of('ui', String), 'awt')
    }
}

dependencies {
    // Forge 平台
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    // Compose Multiplatform + Skiko（方案 B 自包含，运行时随 -all.jar 以 JarJar 加载）
    def composeDeps = [
        compose.desktop.currentOs,
        compose.ui,
        compose.foundation,
        compose.material3,
        compose.runtime
    ]
    composeDeps.each { implementation(it) }
    composeDeps.each { composeRuntime(it) }
    // 桌面实现类只在 runtimeElements 暴露，编译期需显式声明
    implementation "org.jetbrains.compose.ui:ui-desktop:1.8.2"
    implementation "org.jetbrains.skiko:skiko-awt:0.9.4.2"

    // MixinExtras 链式注入：避免与 mega 原版的 @Redirect 争抢同一调用点
    compileOnly "io.github.llamalad7:mixinextras-common:0.3.5"
    annotationProcessor "io.github.llamalad7:mixinextras-common:0.3.5"

    // 自打包 MixinExtras：不依赖 Embeddium 附带的那份，关掉 Oculus/Embeddium 也能启动
    implementation(jarJar("io.github.llamalad7:mixinextras-forge:0.3.5")) {
        jarJar.ranged(it, "[0.3.5,)")
    }

    // Photon VFX（空间斩·斩击雨）：生产环境以嵌套模组随 -all.jar 分发（SRG 原始 jar，FG6 jarJar 配置），
    // 编译与 dev 运行期用 fg.deobf 的官方映射版。分属不同 configuration，两个版本号不会互相冲突。
    // 许可 CC BY-NC-SA 4.0，见 THIRD_PARTY_NOTICES.md；不得解开合并，必须保持嵌套模组形态。
    // embeddium/oculus 是 Photon 的可选 shader 集成依赖，实例里已有，不参与解析。
    implementation fg.deobf("com.lowdragmc.photon:photon-forge-1.20.1:1.1.17") {
        exclude group: "org.embeddedt"
        exclude group: "maven.modrinth"
    }
    jarJar("com.lowdragmc.photon:photon-forge-1.20.1:[1.1.17,1.2)") {
        exclude group: "org.embeddedt"
        exclude group: "maven.modrinth"
    }
    // 调用 Photon 的配置类时 javac 要读它们的父接口（ldlib 的 ITagSerializable/IConfigurable/…），
    // 只给编译期：运行期那份 ldlib 由 photon 自己嵌套提供，不进 jarJar、不改已验证的分发形态。
    compileOnly(fg.deobf("com.lowdragmc.ldlib:ldlib-forge-1.20.1:1.0.42")) {
        exclude group: "appeng"
        exclude group: "dev.latvian.mods"
        exclude group: "mezz.jei"
    }
}

// FG 的 DeobfuscatingRepo 用 __obfuscated 配置自行解析被 deobf 的依赖，声明上的 exclude 传不进去；
// LDLib 的 pom 把 AE2/KubeJS/JEI 声明成 runtime 依赖，任何仓库都取不到，只能在该配置层面排掉。
configurations.matching { it.name == '__obfuscated' }.configureEach {
    exclude group: 'appeng'
    exclude group: 'dev.latvian.mods'
    exclude group: 'mezz.jei'
}

tasks.named('jar', Jar).configure {
  manifest {
    attributes 'MixinConfigs': 'yuan.mixins.json'
  }
  finalizedBy 'reobfJar'
}

// Make the shipped jar reproducible: same sources -> same bytes -> same SHA-256.
//
// Why this matters here: scripts/deploy_jar.ps1 asserts the deployed SHA differs
// from the previous deployment ("did this build actually change?"). A zip stores a
// timestamp per entry, so without this the hash changes on every rebuild even when
// nothing changed, and that assertion carries no information.
//
// It also surfaced a real defect: resource .json files were being checked out as
// CRLF while the index held LF, so the bytes packed into the jar depended on the
// state of the working copy. .gitattributes now pins *.json to eol=lf.
//
// preserveFileTimestamps=false pins every entry to a fixed epoch; reproducibleFileOrder
// sorts entries so directory traversal order cannot vary either.
tasks.withType(AbstractArchiveTask).configureEach {
  preserveFileTimestamps = false
  reproducibleFileOrder = true
}

sourceSets {
    test {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}

def javaCheckClasses = [
    'com.yuan.YuanSecurityCheck',
    'com.yuan.YuanRenderCheck',
    'com.yuan.YuanGuiCheck',
    'com.yuan.YuanBanCheck',
    'com.yuan.MixinConfigCheck',
    'com.yuan.item.YuanAttackCheck',
    'com.yuan.YuanTimeStopCheck',
    'com.yuan.YuanSpaceSlashCheck',
    'com.yuan.YuanTimeRewindCheck',
    'com.yuan.YuanGodSwordConfigCheck',
    'com.yuan.YuanDomainCheck',
]

javaCheckClasses.eachWithIndex { checkEntry, index ->
    tasks.register("javaCheck${index}", JavaExec) {
        dependsOn testClasses
        classpath = sourceSets.test.runtimeClasspath
        mainClass = checkEntry
        jvmArgs '-ea'
    }
}

tasks.register('javaChecks') {
    dependsOn javaCheckClasses.indices.collect { "javaCheck${it}" }
}

tasks.named('build') {
    dependsOn 'javaChecks'
}
