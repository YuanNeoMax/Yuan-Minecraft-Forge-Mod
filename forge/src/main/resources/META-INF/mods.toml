# Forge Mods.toml 配置文件
modLoader = "javafml"
loaderVersion = "[47,)"
license = "MIT"

[[mods]]
modId = "yuan"
version = "${mod_version}"
displayName = "Yuan"
authors = "YuanNeo"
description = '''Yuan weapons and armor mod'''

[[dependencies.yuan]]
modId = "forge"
mandatory = true
versionRange = "[47,48)"
ordering = "NONE"
side = "BOTH"

[[dependencies.yuan]]
modId = "minecraft"
mandatory = true
versionRange = "[1.20.1,1.21)"
ordering = "NONE"
side = "BOTH"

# Photon VFX 随 -all.jar 以嵌套模组分发（见 THIRD_PARTY_NOTICES.md，CC BY-NC-SA 4.0）。
# mandatory=false：万一嵌套包被剥离，Yuan 仍可启动并回退到内置单斩击。
[[dependencies.yuan]]
modId = "photon"
mandatory = false
versionRange = "[1.1.17,)"
ordering = "NONE"
side = "BOTH"

[[dependencies.yuan]]
modId = "ldlib"
mandatory = false
versionRange = "[1.0.42,)"
ordering = "NONE"
side = "BOTH"
